[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "sendspin-router"
version = "0.3.3"
description = "Headless Sendspin router for ioBroker-controlled multi-room audio"
requires-python = ">=3.13,<3.14"
dependencies = [
  "aiosendspin[server]==9.1.1",
  "aiomqtt==2.4.0",
  "PyYAML==6.0.3",
  "fastapi==0.141.1",
  "pydantic==2.13.5",
  "uvicorn==0.53.0",
]

[project.optional-dependencies]
dev = [
  "pytest==9.0.1",
  "pytest-asyncio==1.3.0",
  "ruff==0.13.1",
  "httpx2",
]

[project.scripts]
sendspin-router = "sendspin_router.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.pytest.ini_options]
asyncio_mode = "auto"
